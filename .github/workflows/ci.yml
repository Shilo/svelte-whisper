name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  library:
    name: Library (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Tests, type declarations and the bundle size budget.
      - run: npm run check

  svelte:
    name: Library tests (Svelte ${{ matrix.svelte }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor of the peer range, and the newest release.
        svelte: ['5.0.0', latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Swap in that Svelte for this run only. The size budget and type checks stay on the locked toolchain.
      - run: npm install --no-save --package-lock=false svelte@${{ matrix.svelte }}
      - run: node -p "'svelte ' + require('svelte/package.json').version"
      - run: npm test

  editor:
    name: Editor checks and builds
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editor
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: editor/package-lock.json
      - run: npm ci
      - run: npm run check
      # The data layer: locale file round trips, drafts, placeholders and plurals.
      - run: npm test
      - run: npm run build

  example:
    name: Example builds
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: example
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: example/package-lock.json
      - run: npm ci
      - run: npm run build
